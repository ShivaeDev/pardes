name: lint

# Blocks PRs that aren't biome-clean. `biome ci` runs the formatter check AND the
# linter, exiting non-zero on any issue. Read-only token, actions pinned to full
# commit SHAs. Runs on PRs (and pushes to main as a backstop).
#
# NOTE: this workflow only REPORTS pass/fail. To actually block merge, add it as a
# required status check in the repo ruleset (a repo setting, not YAML).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.13'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome CI (format check + lint)
        run: bun run ci
