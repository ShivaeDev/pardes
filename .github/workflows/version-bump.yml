name: version-bump

# SECURITY POSTURE (see script/bump.ts for the rest):
# - Triggers on push to main ONLY. No pull_request / workflow_dispatch — the job
#   never runs in an untrusted context, so there is no supply-chain surface to
#   hijack (a fork PR can't trigger it; nothing untrusted runs with the token).
# - Least-privilege permissions. Actions pinned to full commit SHAs.
# - Checkout does NOT persist credentials. bump.ts removes GH_TOKEN from its own
#   process env and injects it only into explicit remote Git/gh publication ops.
# - The bump opens a PR with GITHUB_TOKEN, merges it SYNCHRONOUSLY in the same run,
#   then tags the PR's EXACT verified merge commit — resolved from the PR, not main
#   HEAD. It aggregates classifier coverage to a fetched main watermark, rejects
#   pre-merge advancement, and refuses a raced same-plugin integration tag (no
#   bypass actor, no standing secret). A GITHUB_TOKEN merge-push doesn't re-trigger this workflow, so
#   there is no recursion — and that same fact is why the tag must be created inline
#   (an async "tag on merge" step would never fire). The run is re-entrant: a re-run
#   detects an already-landed bump from main's manifest and only ensures the tag.
# - Version tags (`<plugin>--v<version>`) are create-only; a repo ruleset on
#   `*--v*` blocks tag update + delete (supply-chain protection). The script never
#   force/moves them — only the disposable bot-owned `bump/<sha>` branch may be
#   force-with-leased on a re-run.
# - Bounded untrusted strings (commit subjects/diffs) are one argv DATA value,
#   never interpolated into a shell. OpenCode runs in a disposable Git-rooted
#   cwd/HOME with global + PRIMARY-agent wildcard deny and one schema-first verdict
#   submission tool. Its narrowed child env has OPENCODE_API_KEY plus isolated
#   runtime paths/config controls — never GH_TOKEN, persisted credentials, or
#   publication secrets.
#   A resolved-policy preflight asserts fallback build has zero enabled tools and
#   bump has only submit_verdict. The script also rejects fallback-agent warnings,
#   prose salvage, unexpected tools, invalid/multiple submissions, and
#   non-allowlisted release diffs before push. Existing plugin manifest versions
#   are workflow-owned: a source push that edits one is rejected.
# - GITHUB_TOKEN-created bump branch/PR events do NOT launch lint.yml. Before any
#   bump branch push, bump.ts runs the same `bun run ready` deterministic gate
#   inline with publication/provider credentials removed, then reasserts a clean
#   tree. A blanket ruleset that also requires a hosted check on these bot PRs is
#   intentionally fail-closed at synchronous merge; repo policy must account for
#   the trusted bump path without granting any broader bypass.

on:
  push:
    branches: [main]

permissions:
  contents: write        # push the bump branch + the version tags
  pull-requests: write   # open + merge the bump PR

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    # Belt-and-suspenders: the GITHUB_TOKEN auto-merge doesn't trigger a run, but
    # if a human merges the bump PR manually, skip re-processing the bot's commit.
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0   # need history for classifier aggregation + exact tag recovery
          persist-credentials: false # bump.ts injects auth only into explicit remote publication operations

      - name: Read pinned tool versions
        id: tool-versions
        run: |
          echo "bun=$(awk '$1 == "bun" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
          echo "uv=$(awk '$1 == "uv" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.tool-versions.outputs.bun }}

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ steps.tool-versions.outputs.uv }}

      - name: Install dependencies for the inline pre-merge ready gate
        run: bun install --frozen-lockfile

      - name: Install opencode (pinned, from npm)
        run: |
          bun add -g opencode-ai@1.15.12
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Classify, bump, merge, and tag
        env:
          # ONLY GitHub-controlled SHAs here (safe). bump.ts gathers commit
          # messages/diffs itself via git as DATA — nothing attacker-controlled is
          # interpolated into a shell command anywhere.
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}   # OpenCode/OpenCode Go only: opencode[-go]/model
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun script/bump.ts
